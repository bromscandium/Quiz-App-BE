[project]
name = "app"
version = "0.1.0"
description = "backend packages for Quiz App"
authors = [
    { name = "bromscandium" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "annotated-types (==0.7.0)",
    "anyio (==4.11.0)",
    "cfgv (==3.4.0)",
    "click (==8.3.0)",
    "colorama (==0.4.6)",
    "distlib (==0.4.0)",
    "fastapi (==0.118.0)",
    "filelock (==3.19.1)",
    "h11 (==0.16.0)",
    "identify (==2.6.14)",
    "idna (==3.10)",
    "iniconfig (==2.1.0)",
    "nodeenv (==1.9.1)",
    "packaging (==25.0)",
    "platformdirs (==4.4.0)",
    "pluggy (==1.6.0)",
    "pre-commit (==4.3.0)",
    "pydantic (==2.11.9)",
    "pydantic-core (==2.33.2)",
    "pygments (==2.19.2)",
    "pytest (==8.4.2)",
    "python-dotenv (==1.1.1)",
    "pyyaml (==6.0.3)",
    "ruff (==0.13.2)",
    "sniffio (==1.3.1)",
    "starlette (==0.48.0)",
    "typing-inspection (==0.4.1)",
    "typing-extensions (==4.15.0)",
    "uvicorn[standard] (>=0.37.0,<0.38.0)",
    "virtualenv (==20.34.0)",
    "pydantic-settings (>=2.11.0,<3.0.0)",
    "sqlalchemy (>=2.0.43,<3.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "redis[asyncio] (>=6.4.0,<7.0.0)",
    "alembic (>=1.16.5,<2.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "pytest-env (>=1.2.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-asyncio (>=1.2.0,<2.0.0)",
    "sqlmodel (>=0.0.27,<0.0.28)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "aiosqlite (>=0.21.0,<0.22.0)",
    "black (>=25.9.0,<26.0.0)",
    "celery[redis] (>=5.5.3,<6.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
start = "app.main:start"

[dependency-groups]
dev = [
    "pytest (>=8.4.2,<9.0.0)",
    "ruff (>=0.13.2,<0.14.0)",
    "pre-commit (>=4.3.0,<5.0.0)",
    "pytest-env (>=1.1.5,<2.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "black (>=25.9.0,<26.0.0)",
    "autopep8 (>=2.3.2,<3.0.0)"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.poetry.dependencies]
celery = {extras = ["redis"], version = "^5.4.0"}