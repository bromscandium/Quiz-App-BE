services:
  test-postgres:
    container_name: quiz-test-postgres
    image: postgres:17
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD}
      POSTGRES_DB: ${TEST_POSTGRES_DB}
    ports:
      - "${TEST_POSTGRES_PORT}:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${TEST_POSTGRES_USER} -d ${TEST_POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  test-redis:
    container_name: quiz-test-redis
    image: redis:8.2
    env_file:
      - .env
    ports:
      - "${TEST_REDIS_PORT}:6379"
    volumes:
      - redisdata_test:/data
    command: [ "redis-server", "--save", "60", "1" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_test:
  redisdata_test: